<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spotify Miniplayer Lyrics – settings</title>
  <style>
    body { font-family: system-ui, Segoe UI, Arial, sans-serif; margin: 0; padding: 16px 20px; width: 360px; color: #111; background: #fff; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: block; margin: 12px 0; line-height: 1.4; cursor: pointer; }
    label input { margin-right: 8px; vertical-align: top; margin-top: 3px; }
    .hint { display: block; font-size: 12px; color: #555; margin-left: 24px; margin-top: 2px; }
    .warn { color: #a04000; }
    #saved { font-size: 12px; color: #1a7f37; height: 14px; margin-top: 8px; }
    @media (prefers-color-scheme: dark) { body { color: #eee; background: #1c1c1c; } .hint { color: #aaa; } }
  </style>
</head>
<body>
  <h1>Lyrics sources</h1>

  <label>
    <input type="checkbox" id="spotify">
    <span>Spotify's own lyrics (recommended)</span>
    <span class="hint">Reads the lyrics the web player already loads for your account and, if needed, asks Spotify for the current track using your logged‑in session. Best coverage, properly synced.</span>
  </label>

  <label>
    <input type="checkbox" id="netease">
    <span>NetEase Cloud Music (via community proxy)</span>
    <span class="hint warn">Off by default. Uses a proxy server run by an individual (music.xianqiao.wang); the titles and artists of songs you play are sent there.</span>
  </label>

  <p class="hint" style="margin-left:0">LRCLIB and lyrics.ovh are always available as fallbacks.</p>

  <label>
    <input type="checkbox" id="preferLatin">
    <span>Prefer romanized (Latin-script) lyrics</span>
    <span class="hint">When LRCLIB has both a native-script version (e.g. Devanagari) and a romanized one, use the romanized one, like Spotify shows for Hindi songs. Turn off to prefer the native script.</span>
  </label>
  <div id="saved"></div>

  <h1 style="margin-top:20px">Debug</h1>
  <p class="hint" style="margin-left:0">A snapshot of the miniplayer window is taken 3 s after you turn lyrics on (or press <b>D</b> in the miniplayer).</p>
  <div style="display:flex; gap:8px; margin:8px 0">
    <button id="refresh" type="button">Refresh</button>
    <button id="copy" type="button">Copy to clipboard</button>
    <span id="copied" class="hint" style="margin:0; align-self:center"></span>
  </div>
  <textarea id="debug" readonly style="width:100%; height:180px; font: 11px/1.3 Consolas, monospace; box-sizing:border-box"></textarea>

  <script src="options.js"></script>
</body>
</html>
